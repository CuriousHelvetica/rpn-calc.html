<!DOCTYPE html>
<!--
  ╔══════════════════════════════════════════════════════════════════════╗
  ║  Helvetica RPN — iPhone 13 Pro PWA Calculator                       ║
  ║  Hosted on GitHub Pages. Add to Home Screen via Safari.             ║
  ╠══════════════════════════════════════════════════════════════════════╣
  ║  HARD-WON INSIGHTS — read before making any changes                 ║
  ╠══════════════════════════════════════════════════════════════════════╣
  ║                                                                      ║
  ║  1. LAYOUT APPROACH                                                  ║
  ║     The app always renders in landscape inside a portrait viewport.  ║
  ║     #shell is sized and rotated by layoutShell() in JS.             ║
  ║     Portrait:  shell width=VH, height=VW, rotate(90deg)             ║
  ║     Landscape: shell width=VW, height=VH, no rotation               ║
  ║     After rotate(90deg): shell LEFT=physical TOP (notch side)        ║
  ║                           shell RIGHT=physical BOTTOM (home bar)     ║
  ║                                                                      ║
  ║  2. DO NOT TOUCH layoutShell() or #shell CSS                        ║
  ║     This function was extremely hard to get right on iOS Safari.     ║
  ║     Do not change it, do not replace it with CSS vw/vh units,        ║
  ║     do not use window.screen.width (returns physical pixels).        ║
  ║     window.innerWidth/Height returns CSS pixels — always use those.  ║
  ║                                                                      ║
  ║  3. THEME SYSTEM                                                     ║
  ║     Dark mode = default, all colours hardcoded in base CSS.          ║
  ║     Light mode = .light class overrides ONLY, added on <body>.       ║
  ║     Never use CSS variables for theming — they caused layout bugs.   ║
  ║     Toggle button (☀/☾) sits in the display footer next to DEG.     ║
  ║                                                                      ║
  ║  4. PREVIEW IS A RELIABLE INDICATOR                                  ║
  ║     The Claude artifact preview accurately predicts phone rendering. ║
  ║     If the preview looks wrong, the phone will look wrong too.       ║
  ║     Do not upload to GitHub hoping it will look better on device.    ║
  ║                                                                      ║
  ║  5. iOS SAFARI QUIRKS                                                ║
  ║     - overflow:hidden on html/body clips position:fixed children.   ║
  ║       Use overflow:hidden on body only, not html.                    ║
  ║     - vh/vw CSS units are unreliable (URL bar affects vh).           ║
  ║       Always use JS innerWidth/innerHeight for sizing.               ║
  ║     - window.screen.width = physical pixels (3x on iPhone 13 Pro).  ║
  ║       Never use it for layout.                                       ║
  ║     - CSS transitions on layout properties can interfere with        ║
  ║       the rotation transform. Keep transition only on colour props.  ║
  ║                                                                      ║
  ║  6. STACK LOGIC — HP RPN liftEnabled flag                           ║
  ║     liftEnabled=true:  next digit lifts stack before entry           ║
  ║     liftEnabled=false: next digit REPLACES X (set by ENTER, CLx, ←) ║
  ║     Every binary/unary op sets liftEnabled=true after result.        ║
  ║     π, e, RCL, LSTx also overwrite X when lift is disabled.         ║
  ║     ← after entry is terminated acts as CLx. CHS after EEX changes  ║
  ║     the exponent sign. %, Δ%, %T keep Y. →R/→P: r,x in X; θ,y in Y. ║
  ║     This replicates authentic HP 15C stack behaviour.               ║
  ║                                                                      ║
  ║  7. KEY LAYOUT — 10 cols × 4 rows                                   ║
  ║     Left block (cols 1-5): scientific functions                      ║
  ║     Col 6: CHS (row1), EEX (row2), ENTER spanning rows 3-4          ║
  ║     Cols 7-9: digits (7-9, 4-6, 1-3, 0/./000)                      ║
  ║     Col 10: operators (÷ × − +)                                     ║
  ║     Gold labels = f-shift, printed on body ABOVE button             ║
  ║     Blue labels = g-shift, printed on chamfer at bottom of button   ║
  ║                                                                      ║
  ║  8. OFFLINE & UPDATES                                                ║
  ║     sw.js caches every file the app needs. When adding or renaming  ║
  ║     a file, add it to ASSETS in sw.js and bump CACHE.               ║
  ║     The app starts from the saved copy; sw.js checks for a new       ║
  ║     version in the background and saves it for the next start.      ║
  ║     On that start sw.js adds data-updated to the html tag (it looks  ║
  ║     for the tag at the start of a line) and the brand line shows     ║
  ║     UPDATED.                                                         ║
  ║                                                                      ║
  ║  9. TRAINER                                                          ║
  ║     PRACTICE (top of display) opens a game that shows a formula to   ║
  ║     key in. It drives the real keypad: handleKey and the keyboard    ║
  ║     handler call trainerAfterKey, commit() calls trainerOnEntry.     ║
  ║     The calculator state is saved on entry and restored on exit.     ║
  ║     Menus are .tr-ov overlays inside #shell (absolute, so they       ║
  ║     rotate with it); #shell itself is untouched.                     ║
  ╚══════════════════════════════════════════════════════════════════════╝
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Helvetica RPN">
<meta name="theme-color" content="#161616">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Helvetica RPN</title>
<style>
/* Fonts are bundled locally (SIL OFL, see fonts/) so the app works offline */
@font-face{
  font-family:'Orbitron';font-style:normal;font-weight:700;font-display:swap;
  src:url(fonts/orbitron-700-latin.woff2) format('woff2');
}
@font-face{
  font-family:'Share Tech Mono';font-style:normal;font-weight:400;font-display:swap;
  src:url(fonts/share-tech-mono-400-latin.woff2) format('woff2');
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

html,body{
  width:100%;height:100%;
  background:#000;
  /* NOTE: header insight 5 recommends overflow:hidden on body only, but it is
     currently set on both html and body. Left unchanged (layout works on device). */
  overflow:hidden;
  touch-action:none;
  -webkit-user-select:none;user-select:none;
}

/*
  #shell is always landscape-sized.
  JS sets its exact pixel width/height and transform on every resize/orientationchange.

  Portrait phone:   shell width=innerHeight, height=innerWidth, rotate(90deg)
  Landscape phone:  shell width=innerWidth,  height=innerHeight, rotate(0deg)

  Padding (in shell's own CSS coordinate space):
    padding-left  → physical TOP  (notch + status bar ≈ 62px)
    padding-right → physical BOTTOM (home indicator ≈ 34px, use 40px for comfort)
    padding-top/bottom → physical right/left edges (no safe areas needed)
*/
#shell{
  position:fixed;
  display:flex;
  flex-direction:row;
  align-items:stretch;
  background:#161616;
  gap:9px;

  /* Padding constants — safe for iPhone 13 Pro in portrait+rotated layout */
  padding-left:   62px;   /* physical top: notch(47) + status bar margin */
  padding-right:  40px;   /* physical bottom: home indicator(34) + 6px gap */
  padding-top:     6px;
  padding-bottom:  6px;

  /* width, height, top, left, transform all set by layoutShell() */
}

/* ── DISPLAY ── */
.disp{
  width:200px;flex-shrink:0;
  background:#050a04;
  border-radius:8px;
  border:1px solid #1c1c1c;
  box-shadow:inset 0 2px 18px #000;
  display:flex;flex-direction:column;
  padding:10px 12px 8px;
}
.disp-brand{
  font-family:'Orbitron',monospace;
  font-size:10px;font-weight:700;
  color:#aaaaaa;letter-spacing:2px;flex-shrink:0;
  transition:color .3s;
}
.disp-brand.updated{color:#66dd66;}
.disp-aux{
  flex:0.5;
  display:flex;flex-direction:column;
  justify-content:center;
  gap:4px;
  border-bottom:1px solid #1a1a1a;
  margin-bottom:4px;
  padding-bottom:4px;
}
.aux-row{display:flex;justify-content:space-between;align-items:baseline;}
.aux-lbl{
  font-family:'Share Tech Mono',monospace;
  font-size:8px;font-weight:bold;letter-spacing:1px;
  width:32px;flex-shrink:0;
}
.aux-lbl.lbl-m   {color:#777;}
.aux-lbl.lbl-last{color:#555;}
.aux-val{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;font-weight:bold;
  text-align:right;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.aux-val.val-m   {color:#aaaaaa;}
.aux-val.val-last{color:#666666;}
.stack-rows{
  flex:2;display:flex;flex-direction:column;
  justify-content:flex-end;gap:3px;
}
.srow{display:flex;justify-content:space-between;align-items:baseline;}
.slbl{
  font-family:'Share Tech Mono',monospace;
  font-size:9px;color:#666;
  width:16px;flex-shrink:0;letter-spacing:.5px;
}
.sval{
  font-family:'Share Tech Mono',monospace;
  font-size:12px;font-weight:bold;color:#bbbbbb;
  text-align:right;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.srow.xreg .slbl{color:#fff;font-size:10px;font-weight:bold;}
.srow.xreg .sval{color:#fff;font-size:20px;}
.srow.yreg .slbl{color:#ddd;}
.srow.yreg .sval{color:#eee;font-size:14px;}

.disp-footer{
  flex-shrink:0;display:flex;justify-content:space-between;align-items:center;
  margin-top:8px;padding-top:6px;border-top:1px solid #1c1c1c;
}
.inds{display:flex;gap:5px;align-items:center;}
.ind{
  width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  border-radius:3px;font-family:'Share Tech Mono',monospace;
  font-size:12px;font-weight:bold;opacity:0.15;transition:opacity .15s;flex-shrink:0;
}
.ind.on{opacity:1;}
.ind-f{background:#ffcc00;color:#000;}
.ind-g{background:#1199dd;color:#fff;}
.ind-m{background:#777;color:#fff;}

.ang-btn{
  font-family:'Share Tech Mono',monospace;
  font-size:9px;color:#555;border:1px solid #333;border-radius:3px;
  padding:2px 6px;cursor:pointer;letter-spacing:1px;
  -webkit-tap-highlight-color:transparent;
}
.ang-btn:active{color:#fff;border-color:#888;}
.err-line{
  font-family:'Share Tech Mono',monospace;
  font-size:9px;color:#ff5050;min-height:11px;
  text-align:right;margin-top:3px;letter-spacing:1px;flex-shrink:0;
}

/* ── KEYPAD ── */
.keypad{
  flex:1;display:grid;
  grid-template-columns:repeat(10,1fr);
  grid-template-rows:repeat(4,1fr);
  gap:5px;
}
.cell{display:flex;flex-direction:column;gap:0;min-width:0;}
.above{
  font-family:'Share Tech Mono',monospace;
  font-size:9px;font-weight:bold;color:#ffcc00;
  text-align:center;height:13px;line-height:13px;
  letter-spacing:.3px;white-space:nowrap;overflow:hidden;
}
.k{
  flex:1;display:flex;flex-direction:column;
  border-radius:6px;overflow:hidden;
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.16),
    inset 1px 0 0 rgba(255,255,255,.07),
    inset -1px 0 0 rgba(0,0,0,.35),
    0 3px 0 rgba(0,0,0,.95),
    0 4px 8px rgba(0,0,0,.5);
  transition:transform .06s,box-shadow .06s;
}
.k:active{
  transform:translateY(2px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 0 rgba(0,0,0,.9);
}
.kf{
  flex:1;display:flex;align-items:center;justify-content:center;
  background:#202020;padding:0 3px;min-height:0;
}
.kc{
  height:26px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:#141414;border-top:1px solid #333;padding:0 4px;
}
.ml{
  font-family:'Share Tech Mono',monospace;
  font-size:11px;font-weight:bold;color:#fff;
  text-align:center;line-height:1.1;letter-spacing:.3px;white-space:pre;
}
.ml.sm {font-size:9px;}
.ml.num{font-size:19px;}
.ml.op {font-size:17px;}
.ml.ent{font-size:10px;letter-spacing:1.5px;}
.ml.cl {font-size:8px;line-height:1.35;text-align:center;}
.cl-lbl{
  font-family:'Share Tech Mono',monospace;
  font-size:9px;font-weight:bold;color:#55ddff;
  text-align:center;line-height:1;letter-spacing:.3px;white-space:nowrap;
}
.fkey .kf{background:#1a1a1a;} .fkey .ml{color:#ffcc00;}
.gkey .kf{background:#1a1a1a;} .gkey .ml{color:#55ddff;}
.numk .kf{background:#252525;}
.opk  .kf{background:#1e1e1e;}
.clall-k .kf{background:#1e1010;} .clall-k .ml{color:#ff7070;}
.fkey.slit{box-shadow:0 0 10px rgba(255,204,0,.6),0 3px 0 rgba(0,0,0,.9);}
.gkey.slit{box-shadow:0 0 10px rgba(85,221,255,.6),0 3px 0 rgba(0,0,0,.9);}

/* ── LIGHT THEME OVERRIDES ── */
body.light{ background:#c8c8c8; }  /* .light is set on <body> itself */
.light #shell{ background:#bebebe; }
.light .disp{ background:#e8eedc; border-color:#a8b898; box-shadow:inset 0 2px 16px rgba(0,0,0,.1); }
.light .disp-brand{ color:#445533; }
.light .disp-brand.updated{ color:#228822; }
.light .disp-aux{ border-bottom-color:#b8c8a8; }
.light .aux-lbl.lbl-m{ color:#667755; }
.light .aux-lbl.lbl-last{ color:#889977; }
.light .aux-val.val-m{ color:#334422; }
.light .aux-val.val-last{ color:#667755; }
.light .slbl{ color:#778866; }
.light .sval{ color:#223311; }
.light .srow.xreg .slbl{ color:#000; }
.light .srow.xreg .sval{ color:#000; }
.light .srow.yreg .slbl{ color:#112200; }
.light .srow.yreg .sval{ color:#112200; }
.light .disp-footer{ border-top-color:#b8c8a8; }
.light .ang-btn{ color:#445533; border-color:#778866; }
.light .above{ color:#aa6600; }
.light .kf{ background:#e0e0e0; }
.light .kc{ background:#cccccc; border-top-color:#b8b8b8; }
.light .ml{ color:#111; }
.light .cl-lbl{ color:#0066bb; }
.light .fkey .kf{ background:#ddd8c0; }
.light .fkey .ml{ color:#aa6600; }
.light .gkey .kf{ background:#c8d8e8; }
.light .gkey .ml{ color:#0066bb; }
.light .numk .kf{ background:#e8e8e8; }
.light .opk  .kf{ background:#dcdcdc; }
.light .clall-k .kf{ background:#f0e0e0; }
.light .clall-k .ml{ color:#cc2222; }

/* Theme toggle button */
.theme-btn{
  background:transparent;border:1px solid #333;border-radius:3px;
  width:22px;height:22px;font-size:13px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
}
.light .theme-btn{ border-color:#778866; }

/* Sound toggle button */
.sound-btn{
  background:transparent;border:1px solid #333;border-radius:3px;
  width:22px;height:22px;font-size:11px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent;
  opacity:0.35;transition:opacity .15s;
  font-family:'Share Tech Mono',monospace;color:#aaa;letter-spacing:0;
}
.sound-btn.on{ opacity:1; color:#fff; border-color:#888; }
.light .sound-btn{ border-color:#778866; color:#445533; }
.light .sound-btn.on{ border-color:#445533; }

/* ── TRAINER ── */
.disp-top{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.train-btn,.tr-skip{
  font-family:'Share Tech Mono',monospace;
  font-size:9px;color:#88cc88;border:1px solid #2a4a2a;border-radius:3px;
  padding:2px 6px;cursor:pointer;letter-spacing:1px;
  -webkit-tap-highlight-color:transparent;
}
.train-btn:active,.tr-skip:active{color:#fff;border-color:#888;}
.tr-panel{
  display:none;flex:1.4;flex-direction:column;gap:3px;min-height:0;
  border-bottom:1px solid #1a1a1a;margin-bottom:4px;padding:6px 0 4px;
}
.disp.training .disp-aux{display:none;}
.disp.training .tr-panel{display:flex;}
.tr-top,.tr-bot{
  display:flex;justify-content:space-between;align-items:center;gap:6px;flex-shrink:0;
  font-family:'Share Tech Mono',monospace;font-size:9px;letter-spacing:1px;color:#777;
}
.tr-meter.hot{color:#ff5050;}
.tr-formula{
  flex:1;display:flex;align-items:center;min-height:0;
  font-family:'Share Tech Mono',monospace;font-size:16px;font-weight:bold;
  color:#b8f0a0;line-height:1.25;word-break:break-word;white-space:pre-line;
}
.tr-formula.long{font-size:13px;}
.tr-status{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tr-status.ok{color:#66dd66;}
.tr-status.bad{color:#ff5050;}
.disp{transition:border-color .15s;}
.disp.flash-ok{border-color:#44cc44;}
.disp.flash-bad{border-color:#ff5050;}

/* Trainer menus: overlays inside #shell, padded like it */
.tr-ov{
  position:absolute;top:0;left:0;right:0;bottom:0;z-index:5;
  display:none;gap:12px;background:#161616;
  padding:8px 40px 8px 62px;
  font-family:'Share Tech Mono',monospace;color:#bbb;
}
.tr-ov.show{display:flex;}
.trm-side{width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:7px;}
.trm-title{font-family:'Orbitron',monospace;font-size:13px;font-weight:700;letter-spacing:2px;color:#ddd;padding:2px 0;}
.trm-mode,.trm-lv,.tr-btn{
  border:1px solid #2e2e2e;border-radius:6px;background:#1e1e1e;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.trm-mode:active,.trm-lv:active,.tr-btn:active{background:#2a2a2a;}
.trm-mode{padding:6px 9px;}
.trm-mode b,.trm-lv b{display:block;font-size:12px;color:#ddd;letter-spacing:1px;}
.trm-mode span,.trm-lv span{display:block;font-size:10px;color:#777;}
.trm-mode.sel{border-color:#ffcc00;}
.trm-mode.sel b{color:#ffcc00;}
.trm-note{flex:1;font-size:10px;color:#666;line-height:1.4;min-height:0;overflow:hidden;}
.tr-btn{padding:7px 12px;text-align:center;font-size:11px;letter-spacing:1px;color:#ddd;}
.trm-levels{
  flex:1;display:grid;min-width:0;gap:5px;
  grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));
}
.trm-lv{display:flex;flex-direction:column;gap:2px;padding:5px 7px;min-height:0;overflow:hidden;}
.trm-lv .n{font-family:'Orbitron',monospace;font-size:15px;font-weight:700;color:#ffcc00;}
.trm-lv b{font-size:10px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.trm-lv .h{flex:1;min-height:0;overflow:hidden;font-size:9px;line-height:1.25;}
.trm-lv .best{font-size:9px;color:#999;white-space:nowrap;}
.stars{color:#ffcc00;letter-spacing:1px;}
.trr-box{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center;}
.trr-head{font-size:11px;letter-spacing:2px;color:#888;}
.trr-score{font-family:'Orbitron',monospace;font-size:24px;font-weight:700;color:#eee;letter-spacing:1px;}
.trr-score .stars{font-size:20px;margin-left:10px;}
.trr-line{font-size:11px;color:#999;letter-spacing:1px;}
.trr-line.new{color:#66dd66;}
.trr-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:420px;}
.trr-chips span{font-size:10px;border:1px solid #333;border-radius:3px;padding:2px 5px;color:#aaa;}
.trr-chips .under{color:#66dd66;border-color:#2a5a2a;}
.trr-chips .over{color:#ff9050;border-color:#5a3a2a;}
.trr-btns{display:flex;gap:8px;margin-top:4px;}

.light .train-btn,.light .tr-skip{color:#445533;border-color:#778866;}
.light .tr-panel{border-bottom-color:#b8c8a8;}
.light .tr-top,.light .tr-bot{color:#667755;}
.light .tr-formula{color:#223311;}
.light .tr-status.ok{color:#228822;}
.light .tr-status.bad{color:#cc2222;}
.light .tr-meter.hot{color:#cc2222;}
.light .tr-ov{background:#bebebe;color:#333;}
.light .trm-title,.light .trr-score{color:#222;}
.light .trm-mode,.light .trm-lv,.light .tr-btn{background:#e0e0e0;border-color:#a8a8a8;}
.light .trm-mode:active,.light .trm-lv:active,.light .tr-btn:active{background:#d0d0d0;}
.light .trm-mode b,.light .trm-lv b,.light .tr-btn{color:#111;}
.light .trm-mode span,.light .trm-lv span,.light .trm-note,.light .trr-head,.light .trr-line,.light .trm-lv .best{color:#555;}
.light .trm-mode.sel{border-color:#aa6600;}
.light .trm-mode.sel b,.light .trm-lv .n,.light .stars{color:#aa6600;}
.light .trr-line.new{color:#228822;}
.light .trr-chips span{border-color:#a8a8a8;color:#444;}
.light .trr-chips .under{color:#228822;}
.light .trr-chips .over{color:#bb5500;}
</style>
</head>
<body>
<div id="shell">
  <div class="disp" id="disp">
    <div class="disp-top">
      <div class="disp-brand">Helvetica RPN</div>
      <span class="train-btn" id="trainBtn" onclick="trainerButton()">PRACTICE</span>
    </div>
    <div class="disp-aux">
      <div class="aux-row">
        <span class="aux-lbl lbl-m">MEM</span>
        <span class="aux-val val-m" id="auxMem">—</span>
      </div>
      <div class="aux-row">
        <span class="aux-lbl lbl-last">LST</span>
        <span class="aux-val val-last" id="auxLast">—</span>
      </div>
    </div>
    <div class="tr-panel">

<script>
// ═══════════════════════════════════════════
// LAYOUT — always show landscape regardless
// of how the device is held
// ═══════════════════════════════════════════
function layoutShell() {
  const shell = document.getElementById('shell');
  const VW = window.innerWidth;
  const VH = window.innerHeight;

  if (VH >= VW) {
    // Device is portrait (or square).
    // Rotate the shell 90deg clockwise so it appears landscape.
    // After rotate(90deg): CSS-left→physical-top, CSS-right→physical-bottom.
    // Shell CSS: width=VH (fills portrait height), height=VW (fills portrait width).
    const W = VH;  // shell CSS width  = portrait height (tall dimension)
    const H = VW;  // shell CSS height = portrait width  (narrow dimension)
    shell.style.width     = W + 'px';
    shell.style.height    = H + 'px';
    // Center the shell. With rotate(90deg) around the element's center,
    // we need the CSS center to sit at the viewport center (VW/2, VH/2).
    // CSS center = (left + W/2, top + H/2)
    // → left = VW/2 - W/2,  top = VH/2 - H/2
    shell.style.left      = (VW / 2 - W / 2) + 'px';  // negative
    shell.style.top       = (VH / 2 - H / 2) + 'px';  // positive
    shell.style.transform = 'rotate(90deg)';
  } else {
    // Device is landscape (iOS rotated the viewport to match phone rotation).
    // No extra rotation needed — just fill the landscape viewport directly.
    // CSS-left = physical-left (notch side), CSS-right = physical-right.
    shell.style.width     = VW + 'px';
    shell.style.height    = VH + 'px';
    shell.style.left      = '0px';
    shell.style.top       = '0px';
    shell.style.transform = 'none';
  }
}

// Run on load and on every resize / orientation change
window.addEventListener('resize',            () => setTimeout(layoutShell, 50));
window.addEventListener('orientationchange', () => setTimeout(layoutShell, 150));
layoutShell();

// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
const SZ=8;
let stack=new Array(SZ).fill(0);
let inputStr='',isTyping=false;
let shiftMode=0;
let angleMode='DEG';
let memory=0,memUsed=false,lastX=0;
let liftEnabled=true;  // HP-style stack lift flag
const LBLS=['X','Y','Z','T','5','6','7','8'];
const REGS=['xreg','yreg','','','','','',''];

// ═══════════════════════════════════════════
// KEY TABLE
// ═══════════════════════════════════════════
const KEYS=[
  // ROW 1 — powers & logs
  {c:1, r:1, main:'x²',   gold:'√x',    blue:'',     fn:'sq',    fFn:'sqrt'                  },
  {c:2, r:1, main:'yˣ',   gold:'x√y',   blue:'%T',   fn:'yx',    fFn:'xrty',  gFn:'pctt'    },
  {c:3, r:1, main:'1/x',  gold:'',      blue:'',     fn:'recip'                              },
  {c:4, r:1, main:'LN',   gold:'eˣ',    blue:'%',    fn:'ln',    fFn:'expx',  gFn:'pct'     },
  {c:5, r:1, main:'LOG',  gold:'10ˣ',   blue:'Δ%',   fn:'log',   fFn:'pow10', gFn:'dpct'    },
  {c:6, r:1, main:'CHS',  gold:'INT',   blue:'FRAC', fn:'chs',   fFn:'intg',  gFn:'frac'    },
  {c:7, r:1, main:'7',    cls:'numk',   msz:'num',   fn:'d7'                                 },
  {c:8, r:1, main:'8',    cls:'numk',   msz:'num',   fn:'d8'                                 },
  {c:9, r:1, main:'9',    cls:'numk',   msz:'num',   fn:'d9'                                 },
  {c:10,r:1, main:'÷',    cls:'opk',    msz:'op',    fn:'div'                                },

  // ROW 2 — constants & trig
  {c:1, r:2, main:'π',    gold:'2π',    blue:'e',    fn:'pi',    fFn:'twopi', gFn:'euler'   },
  {c:2, r:2, main:'x!',   gold:'',      blue:'',     fn:'fact'                               },
  {c:3, r:2, main:'SIN',  gold:'SIN⁻¹', blue:'→R',   fn:'sin',   fFn:'asin',  gFn:'toRec'  },
  {c:4, r:2, main:'COS',  gold:'COS⁻¹', blue:'→P',   fn:'cos',   fFn:'acos',  gFn:'toPol'  },
  {c:5, r:2, main:'TAN',  gold:'TAN⁻¹', blue:'→H',   fn:'tan',   fFn:'atan',  gFn:'toHrs'  },
  {c:6, r:2, main:'EEX',  gold:'',      blue:'',     fn:'eex'                                },
  {c:7, r:2, main:'4',    cls:'numk',   msz:'num',   fn:'d4'                                 },
  {c:8, r:2, main:'5',    cls:'numk',   msz:'num',   fn:'d5'                                 },
  {c:9, r:2, main:'6',    cls:'numk',   msz:'num',   fn:'d6'                                 },
  {c:10,r:2, main:'×',    cls:'opk',    msz:'op',    fn:'mul'                                },

  // ROW 3 — stack ops
  {c:1, r:3, main:'%',    gold:'',      blue:'',     fn:'pct'                                },
  {c:2, r:3, main:'MOD',  gold:'ABS',   blue:'',     fn:'mod',   fFn:'abs'                  },
  {c:3, r:3, main:'R↓',   gold:'',      blue:'R↑',   fn:'rollDn',             gFn:'rollUp' },
  {c:4, r:3, main:'x⇄y',  gold:'RND',   blue:'INT',  fn:'swap',  fFn:'rnd',   gFn:'intg',  msz:'sm'},
  {c:5, r:3, main:'←',    gold:'CLR',   blue:'CLx',  fn:'bksp',  fFn:'clrAll',gFn:'clx'   },
  {c:6, r:3, rs:2, main:'ENTER', gold:'', blue:'LSTx', cls:'enter-k', msz:'ent', fn:'enter', gFn:'lastx'},
  {c:7, r:3, main:'1',    cls:'numk',   msz:'num',   fn:'d1'                                },
  {c:8, r:3, main:'2',    cls:'numk',   msz:'num',   fn:'d2'                                },
  {c:9, r:3, main:'3',    cls:'numk',   msz:'num',   fn:'d3'                                },
  {c:10,r:3, main:'−',    cls:'opk',    msz:'op',    fn:'sub'                               },

  // ROW 4 — control
  {c:1, r:4, main:'CL\nALL', gold:'', blue:'', cls:'clall-k', msz:'cl', fn:'clrAll'          },
  {c:2, r:4, main:'f',    gold:'',      blue:'',     cls:'fkey',  fn:'shiftF'               },
  {c:3, r:4, main:'g',    gold:'',      blue:'',     cls:'gkey',  fn:'shiftG'               },
  {c:4, r:4, main:'STO',  gold:'',      blue:'',     fn:'sto',                 msz:'sm'     },
  {c:5, r:4, main:'RCL',  gold:'',      blue:'',     fn:'rcl',                 msz:'sm'     },
  // col 6 = ENTER span
  {c:7, r:4, main:'0',    cls:'numk',   msz:'num',   fn:'d0'                                },
  {c:8, r:4, main:'·',    cls:'numk',   msz:'num',   fn:'dot'                               },
  {c:9, r:4, main:'000',  gold:'/000',  blue:'',     fn:'d000',  fFn:'div1000', msz:'sm'   },
  {c:10,r:4, main:'+',    cls:'opk',    msz:'op',    fn:'add'                               },
];

// ═══════════════════════════════════════════
// BUILD
// ═══════════════════════════════════════════
function buildKeypad(){
  const kp=document.getElementById('kp');
  KEYS.forEach(k=>{
    const cell=document.createElement('div');
    cell.className='cell '+(k.cls||'');
    cell.style.gridColumn=String(k.c);
    cell.style.gridRow=k.rs?`${k.r}/span ${k.rs}`:String(k.r);

    const above=document.createElement('div');
    above.className='above';above.textContent=k.gold||'';
    cell.appendChild(above);

    const btn=document.createElement('div');
    btn.className='k';
    if(k.cls&&k.cls.includes('fkey'))btn.dataset.sk='f';
    if(k.cls&&k.cls.includes('gkey'))btn.dataset.sk='g';

    const face=document.createElement('div');face.className='kf';
    const ml=document.createElement('span');
    ml.className='ml'+(k.msz?' '+k.msz:'');
    if(k.main.includes('\n'))ml.style.whiteSpace='pre-line';
    ml.textContent=k.main;
    face.appendChild(ml);btn.appendChild(face);

    const cham=document.createElement('div');cham.className='kc';
    if(k.blue){
      const cl=document.createElement('span');
      cl.className='cl-lbl';cl.textContent=k.blue;cham.appendChild(cl);
    }
    btn.appendChild(cham);
    btn.addEventListener('pointerdown',e=>{e.preventDefault();playSoftTap();handleKey(k);});
    cell.appendChild(btn);kp.appendChild(cell);
  });
}

// ═══════════════════════════════════════════
// FORMAT — thousands commas
// ═══════════════════════════════════════════
function fmt(n){
  if(!isFinite(n))return isNaN(n)?'NaN':(n>0?'+∞':'−∞');
  const a=Math.abs(n);
  if(a!==0&&(a>=1e13||a<1e-6))
    return n.toExponential(5).replace('e+','e').replace('e-','e−');
  let s=parseFloat(n.toPrecision(10)).toString();
  const dot=s.indexOf('.');
  const intP=dot>=0?s.slice(0,dot):s;
  const decP=dot>=0?s.slice(dot):'';
  const sign=intP.startsWith('-')?'-':'';
  const d=intP.replace(/^-/,'');
  return sign+d.replace(/\B(?=(\d{3})+(?!\d))/g,',')+decP;
}

// ═══════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════
function render(){
  const area=document.getElementById('stackRows');
  area.innerHTML='';
  // The trainer panel takes the space of the upper registers: show X Y Z T only
  for(let i=tr.on?3:SZ-1;i>=0;i--){
    const row=document.createElement('div');
    row.className='srow'+(REGS[i]?' '+REGS[i]:'');
    const lbl=document.createElement('span');lbl.className='slbl';lbl.textContent=LBLS[i];
    const val=document.createElement('span');val.className='sval';
    val.textContent=(i===0&&isTyping)?(inputStr||'0'):fmt(stack[i]);
    row.appendChild(lbl);row.appendChild(val);area.appendChild(row);
  }
  document.getElementById('annF').className='ind ind-f'+(shiftMode===1?' on':'');
  document.getElementById('annG').className='ind ind-g'+(shiftMode===2?' on':'');
  document.getElementById('annM').className='ind ind-m'+(memUsed?' on':'');
  document.getElementById('angBtn').textContent=angleMode;
  // Aux registers
  document.getElementById('auxMem').textContent  = memUsed ? fmt(memory) : '—';
  document.getElementById('auxLast').textContent = lastX!==0 ? fmt(lastX) : '—';
  document.querySelectorAll('[data-sk]').forEach(b=>{
    b.classList.remove('slit');
    if(shiftMode===1&&b.dataset.sk==='f')b.classList.add('slit');
    if(shiftMode===2&&b.dataset.sk==='g')b.classList.add('slit');
  });
}

let errTimer=null;
function showErr(m){const e=document.getElementById('errLine');e.textContent=m;clearTimeout(errTimer);errTimer=setTimeout(()=>e.textContent='',2500);}
function clearErr(){document.getElementById('errLine').textContent='';}

// ═══════════════════════════════════════════
// STACK
// ═══════════════════════════════════════════
function lift(){for(let i=SZ-1;i>0;i--)stack[i]=stack[i-1];}
function drop(){for(let i=0;i<SZ-1;i++)stack[i]=stack[i+1];}
// Recall a value into X (π, e, RCL, LSTx). Like keyed-in numbers, it
// overwrites X when stack lift is disabled (after ENTER, CLx, ←).
function recallX(v){commit();if(liftEnabled)lift();stack[0]=v;liftEnabled=true;}
function saveLast(){lastX=stack[0];}
function commit(){
  if(!isTyping)return;
  const v=parseFloat(inputStr);stack[0]=isNaN(v)?0:v;
  isTyping=false;inputStr='';
  if(tr.playing)trainerOnEntry(stack[0]);
}
function dgt(d){
  if(!isTyping){
    if(liftEnabled) lift();   // only lift if flag is set
    inputStr=''; isTyping=true;
    liftEnabled=true;         // re-enable for any subsequent new entry
  }
  inputStr+=d;
}
function startEntry(){
  // shared setup for dot and eex when not already typing
  if(liftEnabled) lift();
  liftEnabled=true;
}
function toRad(x){return angleMode==='DEG'?x*Math.PI/180:x;}
function fromRad(x){return angleMode==='DEG'?x*180/Math.PI:x;}
function toggleAngle(){if(tr.on){showErr('DEG IN TRAINER');return;}angleMode=angleMode==='DEG'?'RAD':'DEG';render();}
let isLight=false;
function toggleTheme(){
  isLight=!isLight;
  document.body.classList.toggle('light',isLight);
  document.getElementById('themeBtn').textContent=isLight?'☾':'☀';
}

// ═══════════════════════════════════════════
// AUDIO — soft tap (Web Audio, no files)
// ═══════════════════════════════════════════
let isSoundOn=true;  // keypad sound on by default
let audioCtx=null;
let audioReady=false;

function initAudio(){
  if(audioCtx)return;
  // Declare the clicks as "playback" audio so the iPhone silent switch doesn't
  // mute them — only the ♪ button controls sound (iOS 17+; must be set before
  // the AudioContext is created). Side effect: it pauses other apps' music.
  if('audioSession' in navigator){try{navigator.audioSession.type='playback';}catch(e){}}
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  // Play a silent buffer to unlock iOS audio on first gesture
  const buf=audioCtx.createBuffer(1,1,audioCtx.sampleRate);
  const src=audioCtx.createBufferSource();
  src.buffer=buf;src.connect(audioCtx.destination);src.start();
  audioReady=true;
  audioCtx.addEventListener('statechange',()=>{
    if(audioCtx.state!=='running')return;
    if(pendingTap&&performance.now()-pendingTap<1000)playTapNow();
    pendingTap=0;
  });
}

// iOS only lets audio start inside a user gesture. Sound is on by default, so
// create/resume the audio context on the first touches instead of on the toggle.
function unlockAudio(){
  if(!isSoundOn)return;
  initAudio();
  if(audioCtx.state==='suspended')audioCtx.resume();
}

// On iOS the first tap's touchdown can come before audio is allowed to start.
// Remember that tap and play it as soon as audio starts running.
let pendingTap=0;
['pointerdown','touchend','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,true));

function playSoftTap(){
  if(!isSoundOn||!audioCtx)return;
  if(audioCtx.state!=='running'){pendingTap=performance.now();return;}
  playTapNow();
}

function playTapNow(){
  const a=audioCtx;
  const t=a.currentTime;

  // High-freq clack layer
  const len=Math.floor(a.sampleRate*0.018);
  const buf=a.createBuffer(1,len,a.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,10);
  const src=a.createBufferSource();src.buffer=buf;
  const mid=a.createBiquadFilter();mid.type='peaking';mid.frequency.value=1800;mid.gain.value=12;
  const hi=a.createBiquadFilter();hi.type='highpass';hi.frequency.value=5000;
  const hg=a.createGain();hg.gain.setValueAtTime(0.13,t);
  src.connect(mid);mid.connect(hi);hi.connect(hg);hg.connect(a.destination);
  src.start(t);

  // Deep sub thump (D2: 60Hz→20Hz, 80ms)
  const osc=a.createOscillator();
  osc.type='sine';
  osc.frequency.setValueAtTime(60,t);
  osc.frequency.exponentialRampToValueAtTime(20,t+0.08);
  const sg=a.createGain();
  sg.gain.setValueAtTime(0.17,t);
  sg.gain.exponentialRampToValueAtTime(0.001,t+0.08);
  osc.connect(sg);sg.connect(a.destination);
  osc.start(t);osc.stop(t+0.08);
}

function toggleSound(){
  if(!isSoundOn){initAudio();}  // warm up context on first enable
  isSoundOn=!isSoundOn;
  document.getElementById('soundBtn').classList.toggle('on',isSoundOn);
}

// ═══════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════
const A={
  shiftF(){shiftMode=shiftMode===1?0:1;},
  shiftG(){shiftMode=shiftMode===2?0:2;},
  d0(){dgt('0');},d1(){dgt('1');},d2(){dgt('2');},d3(){dgt('3');},d4(){dgt('4');},
  d5(){dgt('5');},d6(){dgt('6');},d7(){dgt('7');},d8(){dgt('8');},d9(){dgt('9');},
  dot(){if(!isTyping){startEntry();inputStr='0';isTyping=true;}if(!inputStr.includes('.')&&!inputStr.includes('e'))inputStr+='.';},
  eex(){if(!isTyping){startEntry();inputStr='1';isTyping=true;}if(!inputStr.includes('e'))inputStr+='e';},
  chs(){
    if(!isTyping){stack[0]=-stack[0];return;}
    const e=inputStr.indexOf('e');
    if(e<0){inputStr=inputStr.startsWith('-')?inputStr.slice(1):'-'+inputStr;return;}
    // After EEX, CHS changes the sign of the exponent (HP-15C)
    const mant=inputStr.slice(0,e+1),exp=inputStr.slice(e+1);
    inputStr=mant+(exp.startsWith('-')?exp.slice(1):'-'+exp);
  },
  pi(){recallX(Math.PI);},
  twopi(){recallX(2*Math.PI);},
  euler(){recallX(Math.E);},
  d000(){
    // start a new entry with 0, or append three zeros to the current one
    if(!isTyping){dgt('0');return;}
    if(inputStr.includes('e')||/^-?0$/.test(inputStr))return;  // not in exponent, no leading zeros
    // only append if it won't overflow display (cap at 13 digits)
    const digits=(inputStr.replace(/[^0-9]/g,'')).length;
    if(digits+3<=13) inputStr+='000';
  },
  div1000(){ U(x=>x/1000); },
  // ENTER: lift stack, duplicate X, then DISABLE lift so next digit replaces X
  enter(){commit();const x=stack[0];lift();stack[0]=x; liftEnabled=false;},
  rollDn(){commit();const x=stack[0];drop();stack[SZ-1]=x; liftEnabled=true;},
  rollUp(){commit();const t=stack[SZ-1];for(let i=SZ-1;i>0;i--)stack[i]=stack[i-1];stack[0]=t; liftEnabled=true;},
  swap(){commit();[stack[0],stack[1]]=[stack[1],stack[0]]; liftEnabled=true;},
  clx(){commit();stack[0]=0; liftEnabled=false;},  // CLx: next digit replaces X
  // ←: deletes the last digit while typing; once entry is terminated it acts
  // as CLx (HP-15C). Either way, a cleared X is replaced by the next number.
  bksp(){
    if(isTyping){
      inputStr=inputStr.slice(0,-1);
      if(!inputStr||inputStr==='-'){inputStr='';isTyping=false;stack[0]=0;liftEnabled=false;}
    }
    else{stack[0]=0;liftEnabled=false;}
  },
  clrAll(){stack.fill(0);memory=0;memUsed=false;lastX=0;inputStr='';isTyping=false;liftEnabled=true;},
  lastx(){recallX(lastX);},
  add(){B((y,x)=>y+x);},sub(){B((y,x)=>y-x);},mul(){B((y,x)=>y*x);},
  div(){B((y,x)=>{if(x===0){showErr('DIV BY 0');return NaN;}return y/x;});},
  mod(){B((y,x)=>{if(x===0){showErr('DIV BY 0');return NaN;}return y%x;});},
  // Percentage functions leave Y (the base value) in place, as on HP calculators
  pct(){P((y,x)=>y*x/100);},
  dpct(){P((y,x)=>{if(y===0){showErr('DIV BY 0');return NaN;}return(x-y)/y*100;});},
  pctt(){P((y,x)=>{if(y===0){showErr('DIV BY 0');return NaN;}return x/y*100;});},
  sqrt(){U(x=>{if(x<0){showErr('DOMAIN');return NaN;}return Math.sqrt(x);});},
  sq(){U(x=>x*x);},
  expx(){U(x=>Math.exp(x));},
  ln(){U(x=>{if(x<=0){showErr('DOMAIN');return NaN;}return Math.log(x);});},
  pow10(){U(x=>Math.pow(10,x));},
  log(){U(x=>{if(x<=0){showErr('DOMAIN');return NaN;}return Math.log10(x);});},
  yx(){B((y,x)=>Math.pow(y,x));},
  xrty(){B((y,x)=>{if(x===0){showErr('DIV BY 0');return NaN;}return Math.pow(y,1/x);});},
  recip(){U(x=>{if(x===0){showErr('DIV BY 0');return NaN;}return 1/x;});},
  fact(){U(x=>{if(x<0||x!==Math.floor(x)){showErr('DOMAIN');return NaN;}if(x>170){showErr('OVERFLOW');return Infinity;}let r=1;for(let i=2;i<=x;i++)r*=i;return r;});},
  abs(){U(x=>Math.abs(x));},intg(){U(x=>Math.trunc(x));},frac(){U(x=>x-Math.trunc(x));},
  rnd(){U(x=>parseFloat(x.toPrecision(6)));},
  sin(){U(x=>Math.sin(toRad(x)));},cos(){U(x=>Math.cos(toRad(x)));},tan(){U(x=>Math.tan(toRad(x)));},
  asin(){U(x=>{if(Math.abs(x)>1){showErr('DOMAIN');return NaN;}return fromRad(Math.asin(x));});},
  acos(){U(x=>{if(Math.abs(x)>1){showErr('DOMAIN');return NaN;}return fromRad(Math.acos(x));});},
  atan(){U(x=>fromRad(Math.atan(x)));},
  // HP-15C register order: →R takes r in X, θ in Y and returns x in X, y in Y;
  // →P is the inverse (x in X, y in Y → r in X, θ in Y).
  toRec(){commit();saveLast();const r=stack[0],th=toRad(stack[1]);stack[0]=r*Math.cos(th);stack[1]=r*Math.sin(th); liftEnabled=true;},
  toPol(){commit();saveLast();const x=stack[0],y=stack[1];stack[0]=Math.hypot(x,y);stack[1]=fromRad(Math.atan2(y,x)); liftEnabled=true;},
  toHrs(){U(x=>{const h=Math.trunc(x);const rem=(x-h)*100;const m=Math.trunc(rem);const s=(rem-m)*100;return h+m/60+s/3600;});},
  sto(){commit();memory=stack[0];memUsed=true; liftEnabled=true;},
  rcl(){recallX(memory);},
};
function B(fn){commit();saveLast();const x=stack[0],y=stack[1];const r=fn(y,x);if(r!==undefined&&!isNaN(r)){drop();stack[0]=r;} liftEnabled=true;}
function U(fn){commit();saveLast();const r=fn(stack[0]);if(r!==undefined&&!isNaN(r))stack[0]=r; liftEnabled=true;}
function P(fn){commit();saveLast();const r=fn(stack[1],stack[0]);if(r!==undefined&&!isNaN(r))stack[0]=r; liftEnabled=true;}  // like B, but keeps Y

function handleKey(k){
  if(trainerBlocksKeys())return;
  clearErr();
  const isShift=(k.fn==='shiftF'||k.fn==='shiftG');
  let fn;
  if(shiftMode===1&&!isShift){fn=k.fFn||k.fn;shiftMode=0;}
  else if(shiftMode===2&&!isShift){fn=k.gFn||k.fn;shiftMode=0;}
  else fn=k.fn;
  if(fn&&A[fn])A[fn]();
  render();
  if(tr.playing)trainerAfterKey(fn,1);  // one keypad press
}

const trRad=x=>x*Math.PI/180,trDeg=x=>x*180/Math.PI;
function trVal(n){
  switch(n.t){
    case 'n':case 'v':return n.v;
    case 'c':return {pi:Math.PI,e:Math.E,twopi:2*Math.PI}[n.k];
  }
  if(n.t==='b'){
    const a=trVal(n.a),b=trVal(n.b);
    switch(n.op){
      case 'add':return a+b;
      case 'sub':return a-b;
      case 'mul':return a*b;
      case 'div':return a/b;
      case 'pow':return Math.pow(a,b);
      case 'xrty':return Math.pow(a,1/b);
      case 'pct':return a*b/100;
      case 'addpct':return a+a*b/100;
      case 'subpct':return a-a*b/100;
      case 'dpct':return (b-a)/a*100;
      case 'pctt':return b/a*100;
    }
  }
  const a=trVal(n.a);
  switch(n.op){
    case 'sqrt':return Math.sqrt(a);
    case 'sq':return a*a;
    case 'recip':return 1/a;
    case 'ln':return Math.log(a);
    case 'expx':return Math.exp(a);
    case 'log':return Math.log10(a);
    case 'pow10':return Math.pow(10,a);
    case 'fact':{let r=1;for(let i=2;i<=a;i++)r*=i;return r;}
    case 'sin':return Math.sin(trRad(a));
    case 'cos':return Math.cos(trRad(a));
    case 'tan':return Math.tan(trRad(a));
    case 'asin':return trDeg(Math.asin(a));
    case 'acos':return trDeg(Math.acos(a));
    case 'atan':return trDeg(Math.atan(a));
  }
}
function trNodes(n,out=[]){out.push(n);if(n.a)trNodes(n.a,out);if(n.b)trNodes(n.b,out);return out;}
const trSame=(x,y)=>Math.abs(x-y)<=1e-9*Math.max(1,Math.abs(y));

// Numbers the player may key in: the formula's own (sign aside), plus the
// ones a fair alternative route needs (1 for 1/x, 2 for 2π, 10 for 10ˣ, 100 for %)
const TR_PCT_OPS=['pct','addpct','subpct','dpct','pctt'];
function trAllowed(f){
  const out=[];
  for(const n of trNodes(f)){
    if(n.t==='n'||n.t==='v')out.push(Math.abs(n.v));
    if(n.op==='recip')out.push(1);
    if(n.k==='twopi')out.push(2);
    if(n.op==='pow10')out.push(10);
    if(TR_PCT_OPS.includes(n.op))out.push(100);
  }
  return out;
}
// Run keystrokes on the real calculator engine and return X, leaving the
// calculator as it was.
function trSim(seq){
  const keep={stack:stack.slice(),inputStr,isTyping,shiftMode,angleMode,memory,memUsed,lastX,liftEnabled};
  const playing=tr.playing,err=showErr;
  tr.playing=false;showErr=()=>{};
  A.clrAll();angleMode='DEG';
  let x=NaN;
  try{for(const fn of seq)A[fn]();commit();x=stack[0];}catch(e){}
  ({stack,inputStr,isTyping,shiftMode,angleMode,memory,memUsed,lastX,liftEnabled}=keep);
  tr.playing=playing;showErr=err;
  return x;
}
// A formula is fair if its answer isn't one of its numbers, no part of it
// already equals the answer (so it can't pass part-way through), and its
// par route really reaches the answer.
function trFair(f){
  const ans=trVal(f);
  if(!isFinite(ans)||ans===0||Math.abs(ans)>1e30)return false;
  if(trAllowed(f).some(v=>trSame(Math.abs(ans),v)))return false;
  if(!trNodes(f).slice(1).every(n=>!trSame(trVal(n),ans)))return false;
  return trSame(trSim(trParRoute(f)),ans);
}
function trMake(level){
  for(let i=0;i<100;i++){const f=pick(TR_GEN[level-1])();if(trFair(f))return f;}
  return trB('add',trN(3),trN(4));
}

// ── Formula text ──
const TR_SYM={add:'+',sub:'−',mul:'×',div:'÷'};
const TR_PREC={add:1,sub:1,mul:2,div:2};
const trSup=v=>String(v).replace(/[\d-]/g,c=>c==='-'?'⁻':'⁰¹²³⁴⁵⁶⁷⁸⁹'[c]);
function trPrec(n){
  if(n.t==='b')return n.op==='pow'||n.op==='xrty'?3:TR_PREC[n.op]||1;
  if(n.t==='u')return n.op==='recip'?2:4;
  return 9;
}
// left: n opens the expression around it, where a bare −7 reads fine
function trWrap(n,need,left){
  const s=trText(n);
  if(n.t==='n'&&(n.m!==undefined||(n.v<0&&!left)))return '('+s+')';
  return trPrec(n)<need?'('+s+')':s;
}
const trIsX=n=>n.t==='v'||((n.op==='sq'||n.op==='pow')&&n.a.t==='v');
function trText(n){
  switch(n.t){
    case 'n':return n.m!==undefined?n.m+'×10'+trSup(n.e):n.v<0?'−'+(-n.v):String(n.v);
    case 'c':return {pi:'π',e:'e',twopi:'2π'}[n.k];
    case 'v':return 'x';
  }
  if(n.t==='b'){
    const a=n.a,b=n.b;
    switch(n.op){
      case 'pow':return trWrap(a,9)+trSup(b.v);
      case 'xrty':return (b.v===3?'∛':b.v===4?'∜':trSup(b.v)+'√')+trWrap(a,9);
      case 'pct':return b.v+'% of '+a.v;
      case 'addpct':return a.v+' + '+b.v+'%';
      case 'subpct':return a.v+' − '+b.v+'%';
      case 'dpct':return '% change '+a.v+' → '+b.v;
      case 'pctt':return b.v+' as % of '+a.v;
    }
    if(n.op==='mul'&&a.t==='n'&&a.v>0&&a.m===undefined&&trIsX(b))return a.v+trText(b);  // 3x²
    const p=TR_PREC[n.op],strict=n.op==='sub'||n.op==='div';
    return trWrap(a,p,true)+' '+TR_SYM[n.op]+' '+trWrap(b,strict?p+1:p);
  }
  const a=trWrap(n.a,9),sp=a[0]==='('?'':' ';
  switch(n.op){
    case 'sqrt':return '√'+a;
    case 'sq':return a+'²';
    case 'fact':return a+'!';
    case 'recip':return '1/'+a;
    case 'sin':case 'cos':case 'tan':return n.op+sp+a+'°';
    case 'asin':case 'acos':case 'atan':return n.op.slice(1)+'⁻¹'+sp+a;
    case 'expx':return n.a.t==='n'?'e'+trSup(n.a.v):'e^'+a;
    case 'pow10':return n.a.t==='n'?'10'+trSup(n.a.v):'10^'+a;
    default:return n.op+sp+a;  // ln, log
  }
}
function trFormula(f){return trText(f)+(f.mem===undefined?'':'\nx = '+f.mem);}

// ── Par: the shortest straightforward keystroke route ──
const TR_OPFN={add:'add',sub:'sub',mul:'mul',div:'div',pow:'yx',xrty:'xrty',
  sqrt:'sqrt',sq:'sq',recip:'recip',ln:'ln',expx:'expx',log:'log',pow10:'pow10',fact:'fact',
  sin:'sin',cos:'cos',tan:'tan',asin:'asin',acos:'acos',atan:'atan',
  pct:'pct',dpct:'dpct',pctt:'pctt'};
const TR_CFN={pi:'pi',e:'euler',twopi:'twopi'};
// Keypad presses for a function: shifted ones take f or g first
function trPress(fn){
  let k=KEYS.find(k=>k.fn===fn);if(k)return [k];
  k=KEYS.find(k=>k.fFn===fn);if(k)return [KEYS.find(k=>k.fn==='shiftF'),k];
  k=KEYS.find(k=>k.gFn===fn);if(k)return [KEYS.find(k=>k.fn==='shiftG'),k];
  return [];
}
function trCost(seq){return seq.reduce((s,fn)=>s+trPress(fn).length,0);}
function trDigits(v){
  let s=String(v),z=0;
  if(s.startsWith('0.'))s=s.slice(1);  // · on its own starts "0."
  while(s.length>3&&s.endsWith('000')){s=s.slice(0,-3);z++;}  // the 000 key
  return [...s].map(c=>c==='.'?'dot':'d'+c).concat(Array(z).fill('d000'));
}
function trNumKeys(n){
  if(n.m!==undefined)return trDigits(n.m).concat('eex',trDigits(Math.abs(n.e)),n.e<0?['chs']:[]);
  return trDigits(Math.abs(n.v)).concat(n.v<0?['chs']:[]);
}
// afterNum: the previous step keyed in a number, so a new one needs ENTER
// first. Recalled values (π, e, RCL) lift the stack themselves.
function trRoute(n,afterNum){
  if(n.t==='n')return (afterNum?['enter']:[]).concat(trNumKeys(n));
  if(n.t==='c')return [TR_CFN[n.k]];
  if(n.t==='v')return ['rcl'];
  if(n.t==='u')return trRoute(n.a,afterNum).concat(TR_OPFN[n.op]);
  const op=TR_OPFN[n.op],comm=n.op==='add'||n.op==='mul';
  const ab=trRoute(n.a,afterNum).concat(trRoute(n.b,n.a.t==='n'),op);
  const ba=trRoute(n.b,afterNum).concat(trRoute(n.a,n.b.t==='n'),comm?[op]:['swap',op]);
  return trCost(ba)<trCost(ab)?ba:ab;
}
function trParRoute(f){
  if(f.route)return f.route;
  const r=trRoute(f,false);
  return f.mem===undefined?r:trDigits(f.mem).concat('sto',r);
}

// ── Sounds & flashes ──
function trTone(freq,t,dur,type,vol){
  const a=audioCtx,o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.12,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur);
}
function trSound(kind){
  if(!isSoundOn||!audioCtx||audioCtx.state!=='running')return;
  const t=audioCtx.currentTime;
  if(kind==='ok'){trTone(880,t,.09);trTone(1320,t+.08,.16);}
  else if(kind==='birdie')[880,1109,1319,1760].forEach((f,i)=>trTone(f,t+i*.07,.14));
  else if(kind==='bad')trTone(150,t,.2,'square',.05);
  else if(kind==='tick')trTone(1000,t,.04,'sine',.06);
  else if(kind==='end')[784,659,523].forEach((f,i)=>trTone(f,t+i*.15,.18));
}
function trFlash(cls){
  const d=document.getElementById('disp');
  d.classList.remove('flash-ok','flash-bad');d.classList.add(cls);
  setTimeout(()=>d.classList.remove(cls),400);
}

// ── Best scores (this device only) ──
function trLoadBest(){
  try{const b=JSON.parse(localStorage.getItem('rpnTrainerBest'));if(b&&b.cd&&b.par)return b;}catch(e){}
  return {cd:{},par:{}};
}
function trSaveBest(b){try{localStorage.setItem('rpnTrainerBest',JSON.stringify(b));}catch(e){}}
function trStars(mode,level,score){
  if(mode==='cd'){const s=TR_CD_STARS[level-1];return score>=s[2]?3:score>=s[1]?2:score>=s[0]?1:0;}
  return score<=0?3:score<=4?2:1;  // par: strokes over par for the set
}
const trStarText=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const trSigned=v=>v>0?'+'+v:v<0?'−'+(-v):'0';

// ── Menu ──
function trainerButton(){if(tr.on)trainerClose();else trainerOpen();}
function trainerOpen(){
  trStop();
  if(!tr.on){
    tr.saved={stack:stack.slice(),inputStr,isTyping,shiftMode,angleMode,memory,memUsed,lastX,liftEnabled};
    tr.on=true;
  }
  tr.playing=false;
  document.getElementById('trResult').classList.remove('show');
  document.getElementById('trMenu').classList.add('show');
  trainerPickMode(tr.mode);
}
function trainerPickMode(m){
  tr.mode=m;
  try{localStorage.setItem('rpnTrainerMode',m);}catch(e){}
  document.getElementById('trmCd').classList.toggle('sel',m==='cd');
  document.getElementById('trmPar').classList.toggle('sel',m==='par');
  document.getElementById('trmNote').textContent=m==='cd'
    ?'Key each formula in RPN until X shows its value. Use only the numbers in the formula; the π and e keys are fine. CLR ALL starts a formula over; SKIP moves on.'
    :'Par is the keystroke count of a standard RPN route; f and g count as a press. CLR ALL restarts a formula and its count. Beat par for a birdie. SKIP costs par + '+SKIP_PENALTY+'.';
  const best=trLoadBest()[m],box=document.getElementById('trmLevels');
  box.innerHTML='';
  TR_LEVELS.forEach((L,i)=>{
    const lv=i+1,b=best[lv];
    const el=document.createElement('div');el.className='trm-lv';
    el.innerHTML='<div class="n">'+lv+'</div><b></b><span class="h"></span><div class="best"></div>';
    el.querySelector('b').textContent=L.name;
    el.querySelector('.h').textContent=L.hint;
    el.querySelector('.best').innerHTML=b===undefined?'—'
      :'BEST '+(m==='cd'?b:trSigned(b))+'<span class="stars">'+trStarText(trStars(m,lv,b))+'</span>';
    el.onclick=()=>trainerStart(lv);
    box.appendChild(el);
  });
}
function trainerClose(){
  trStop();
  document.getElementById('trMenu').classList.remove('show');
  document.getElementById('trResult').classList.remove('show');
  document.getElementById('disp').classList.remove('training');
  document.getElementById('trainBtn').textContent='PRACTICE';
  if(tr.saved)({stack,inputStr,isTyping,shiftMode,angleMode,memory,memUsed,lastX,liftEnabled}=tr.saved);
  tr.saved=null;tr.on=false;tr.playing=false;
  render();
}

// ── Play ──
function trainerStart(level){
  trStop();
  document.getElementById('trMenu').classList.remove('show');
  document.getElementById('trResult').classList.remove('show');
  document.getElementById('disp').classList.add('training');
  document.getElementById('trainBtn').textContent='EXIT';
  angleMode='DEG';
  Object.assign(tr,{level,playing:true,busy:false,solved:0,n:0,results:[]});
  if(tr.mode==='cd'){
    const secs=TR_LEVELS[level-1].secs||CD_SECS;
    tr.endAt=performance.now()+secs*1000;tr.lastSec=secs;
    tr.timer=setInterval(trTick,200);
  }
  trNext();
}
function trStop(){
  clearInterval(tr.timer);clearTimeout(tr.pending);
  tr.timer=tr.pending=null;tr.busy=false;
}
function trNext(){
  tr.f=trMake(tr.level);
  tr.ans=trVal(tr.f);
  tr.allowed=trAllowed(tr.f);
  tr.par=trCost(trParRoute(tr.f));
  tr.keys=0;tr.tries=1;tr.tainted=false;tr.msg='';tr.busy=false;
  A.clrAll();shiftMode=0;
  render();trUpdate();
}
function trUpdate(){
  const cd=tr.mode==='cd';
  document.getElementById('trProg').textContent='L'+tr.level+' · '+(cd?'SOLVED '+tr.solved:(tr.n+1)+'/'+PAR_SET);
  const m=document.getElementById('trMeter');
  if(cd){
    const s=Math.max(0,Math.ceil((tr.endAt-performance.now())/1000));
    m.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    m.classList.toggle('hot',s<=10);
  }else{
    m.textContent='KEYS '+tr.keys+' · PAR '+tr.par;
    m.classList.remove('hot');
  }
  const fe=document.getElementById('trFormula'),ft=trFormula(tr.f);
  fe.textContent=ft;
  fe.classList.toggle('long',ft.length>22);
  const st=document.getElementById('trStatus');
  st.className='tr-status '+(tr.msg?tr.msgCls:'');
  st.textContent=tr.msg||(!cd&&tr.tries>1?'TRY '+tr.tries:'');
}
function trSay(msg,cls){tr.msg=msg;tr.msgCls=cls;trUpdate();}
function trTick(){
  const left=tr.endAt-performance.now();
  const s=Math.ceil(left/1000);
  if(s<tr.lastSec){tr.lastSec=s;if(s<=5&&s>0)trSound('tick');}
  if(left<=0){trFinish();return;}
  trUpdate();
}

// commit() reports each number keyed in
function trainerOnEntry(v){
  if(tr.allowed.some(a=>trSame(Math.abs(v),a)))return;
  tr.tainted=true;
  trSound('bad');trFlash('flash-bad');
  trSay(fmt(v)+' NOT IN FORMULA · CLR ALL','bad');
}
// After every key: count it, then check whether X holds the answer
function trainerAfterKey(fn,cost){
  if(fn==='clrAll'){
    tr.keys=0;tr.tries++;tr.tainted=false;tr.msg='';
    trUpdate();return;
  }
  tr.keys+=cost;
  if(!isTyping&&!tr.tainted&&trSame(stack[0],tr.ans))trSolved();
  else trUpdate();
}
function trSolved(){
  tr.busy=true;
  trFlash('flash-ok');
  if(tr.mode==='cd'){
    tr.solved++;
    trSound('ok');trSay('✓ SOLVED','ok');
    tr.pending=setTimeout(trNext,600);
    return;
  }
  tr.results.push({keys:tr.keys,par:tr.par});
  const d=tr.keys-tr.par;
  trSound(d<0?'birdie':'ok');
  trSay(d<0?'✓ BIRDIE! '+trSigned(d):d===0?'✓ ON PAR':'✓ '+trSigned(d)+' OVER PAR','ok');
  tr.pending=setTimeout(trAdvance,1300);
}
function trAdvance(){
  tr.n++;
  if(tr.n>=PAR_SET)trFinish();else trNext();
}
function trainerSkip(){
  if(!tr.playing||tr.busy)return;
  if(tr.mode==='cd'){trNext();return;}
  tr.results.push({keys:tr.par+SKIP_PENALTY,par:tr.par,skipped:true});
  trAdvance();
}
function trFinish(){
  trStop();
  tr.playing=false;
  trSound('end');
  const cd=tr.mode==='cd',lv=tr.level;
  const score=cd?tr.solved:tr.results.reduce((s,r)=>s+r.keys-r.par,0);
  const all=trLoadBest(),old=all[tr.mode][lv];
  const isBest=old===undefined||(cd?score>old:score<old);
  if(isBest){all[tr.mode][lv]=score;trSaveBest(all);}
  document.getElementById('trrHead').textContent='LEVEL '+lv+' · '+TR_LEVELS[lv-1].name+' · '+(cd?'COUNTDOWN':'KEYSTROKE PAR');
  document.getElementById('trrScore').innerHTML=(cd?'SOLVED '+score:trSigned(score)+' PAR')
    +'<span class="stars">'+trStarText(trStars(tr.mode,lv,score))+'</span>';
  const line=document.getElementById('trrLine');
  if(cd)line.textContent=isBest&&score>0?'NEW BEST!':'BEST '+(isBest?score:old);
  else{
    const keys=tr.results.reduce((s,r)=>s+r.keys,0),par=tr.results.reduce((s,r)=>s+r.par,0);
    line.textContent=keys+' KEYS · PAR '+par+' · '+(isBest?'NEW BEST!':'BEST '+trSigned(old));
  }
  line.classList.toggle('new',isBest&&(score>0||!cd));
  const chips=document.getElementById('trrChips');chips.innerHTML='';
  if(!cd)tr.results.forEach((r,i)=>{
    const d=r.keys-r.par,c=document.createElement('span');
    c.className=d<0?'under':d>0?'over':'';
    c.textContent=(i+1)+': '+(r.skipped?'SKIP':trSigned(d));
    chips.appendChild(c);
  });
  document.getElementById('trResult').classList.add('show');
}

buildKeypad();
render();

// Offline support: cache the app with a service worker (needs https, e.g.
// GitHub Pages, or localhost for testing)
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// First start of a new version (sw.js marks it): say so in the brand line
if(document.documentElement.hasAttribute('data-updated')){
  const brand=document.querySelector('.disp-brand');
  brand.textContent='UPDATED';brand.classList.add('updated');
  setTimeout(()=>{brand.textContent='Helvetica RPN';brand.classList.remove('updated');},6000);
}
</script>
